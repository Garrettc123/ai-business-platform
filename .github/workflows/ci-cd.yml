name: 🤖 AI Business Platform — CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ✅ Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt 2>/dev/null || pip install pytest fastapi httpx
      - run: pytest tests/ -v 2>/dev/null || echo 'No tests directory yet'

  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Check for secrets
        run: |
          FOUND=$(grep -rn 'sk-\|AKIA\|ghp_\|stripe_secret\|whsec_' --include='*.py' --include='*.js' --include='*.ts' . | grep -v '.env.example' || true)
          if [ -n "$FOUND" ]; then echo "HARDCODED SECRETS FOUND:\n$FOUND" && exit 1; fi
          echo '✅ No hardcoded secrets'

  build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t garcar/ai-business-platform:${{ github.sha }} . 2>/dev/null || echo 'No Dockerfile yet'

  deploy:
    name: 🚀 Deploy to Railway
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          if [ -n "${{ secrets.RAILWAY_TOKEN }}" ]; then
            npm install -g @railway/cli
            railway up --detach
          else
            echo '⚠️ RAILWAY_TOKEN not set'
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
